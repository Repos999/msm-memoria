<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória MSM - Ilha de Planta</title>
    <style>
        body {
            background-color: #2b1d3d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-top: 10px;
        }

        h2 { text-shadow: 2px 2px 4px #000; text-align: center; margin: 10px 0; font-size: 22px; }

        .btn-limpar { 
            background-color: #ff9800; color: white; margin-bottom: 15px;
            padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
        }

        /* Tabuleiro responsivo */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            width: 95vw;
            max-width: 450px;
        }

        .quadrado {
            background-color: #794a8d;
            border: 2px solid #4a295c;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            aspect-ratio: 1 / 1; 
            overflow: hidden; /* Garante que o zoom da imagem não saia das bordas */
        }

        .quadrado img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.15); /* DÁ UM ZOOM DE 15% NA IMAGEM PARA TAMPAR O QUADRADO */
            pointer-events: none;
        }

        /* Efeito de clique no quadrado do tabuleiro */
        .quadrado:active img {
            transform: scale(1.05); /* Pequeno efeito visual ao tocar na carta */
        }

        /* Janela Modal */
        .modal {
            display: none; 
            position: fixed;
            z-index: 10;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }

        .modal-conteudo {
            background-color: #4a295c;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #794a8d;
            width: 90%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
        }

        .modal-conteudo h3 { margin-top: 0; text-align: center; font-size: 18px; }

        #buscaMonstro {
            padding: 10px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .lista-monstros {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .item-lista {
            display: flex;
            align-items: center;
            background-color: #3b284f;
            border: 1px solid #2b1d3d;
            border-radius: 8px;
            padding: 5px;
            cursor: pointer;
        }

        .item-lista img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-right: 15px;
            border-radius: 5px;
            background-color: #2b1d3d; 
        }

        .item-lista span { font-weight: bold; font-size: 14px; }
        .item-lista:active { background-color: #4CAF50; }

        .btn-cancelar { 
            background-color: #f44336; color: white; width: 100%; 
            padding: 12px; border: none; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer;
        }
    </style>
</head>

        const tabuleiro = document.getElementById("tabuleiro");
        for (let i = 0; i < 35; i++) {
            let div = document.createElement("div");
            div.className = "quadrado";
            // Já injeta a imagem virada para trás na criação
            div.innerHTML = `<img src="${imagemFundo}" alt="Virado">`;
            div.onclick = () => abrirModal(div);
            tabuleiro.appendChild(div);
        }

        function renderizarLista(filtro = "") {
            const listaContainer = document.getElementById("listaOpcoes");
            listaContainer.innerHTML = ""; 

            itensData.forEach(item => {
                if (item.nome.toLowerCase().includes(filtro.toLowerCase())) {
                    let div = document.createElement("div");
                    div.className = "item-lista";
                    div.onclick = () => confirmarMonstro(item);
                    
                    let conteudoHTML = "";
                    if (item.arquivo === "") {
                        conteudoHTML = `<div style="width:45px; height:45px; margin-right:15px; font-size:30px; text-align:center;">🧹</div> <span>${item.nome}</span>`;
                    } else {
                        let linkImagem = urlBase + item.arquivo;
                        // Na lista da janela, o zoom é desativado para a miniatura ficar inteira
                        conteudoHTML = `<img src="${linkImagem}" alt="${item.nome}" style="transform: scale(1);"> <span>${item.nome}</span>`;
                    }

                    div.innerHTML = conteudoHTML;
                    listaContainer.appendChild(div);
                }
            });
        }

        function abrirModal(elemento) {
            quadradoAtual = elemento;
            document.getElementById("modalMonstros").style.display = "flex";
            document.getElementById("buscaMonstro").value = "";
            renderizarLista();
        }

        function fecharModal() {
            document.getElementById("modalMonstros").style.display = "none";
            quadradoAtual = null;
        }

        function filtrarLista() {
            const textoBusca = document.getElementById("buscaMonstro").value;
            renderizarLista(textoBusca);
        }

        function confirmarMonstro(item) {
            if (quadradoAtual) {
                if (item.arquivo === "") {
                    // Ao invés de ficar vazio, ele restaura a imagem do quadradinho roxo
                    quadradoAtual.innerHTML = `<img src="${imagemFundo}" alt="Virado">`;
                } else {
                    let linkImagem = urlBase + item.arquivo;
                    quadradoAtual.innerHTML = `<img src="${linkImagem}" alt="${item.nome}">`;
                }
            }
            fecharModal();
        }

        function limparTabuleiro() {
            if(confirm("Deseja apagar todas as marcações e virar as cartas para baixo?")) {
                let quadrados = document.querySelectorAll(".quadrado");
                quadrados.forEach(q => {
                    // Restaura todas as cartas para a imagem do quadradinho roxo
                    q.innerHTML = `<img src="${imagemFundo}" alt="Virado">`;
                });
            }
        }
