        body {
            background-color: #2b1d3d; 
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-top: 10px;
        }

        h2 { 
            text-shadow: 2px 2px 4px #000; 
            text-align: center; 
            margin: 10px 0; 
            font-size: 24px; 
        }

        /* -------------------------------------- */
        /* MENUS (Islands & Levels)               */
        /* -------------------------------------- */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
            margin-top: 30px;
        }

        .menu-container h3 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .btn-menu {
            background-color: #794a8d;
            border: 3px solid #4a295c;
            color: white;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-menu:hover, .btn-menu:active {
            transform: scale(1.05);
            background-color: #925ba8;
        }

        .btn-voltar-menu {
            background-color: #f44336;
            margin-top: 10px;
        }

        /* -------------------------------------- */
        /* GAME BOARD                             */
        /* -------------------------------------- */
        #telaJogo {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .controles-topo {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-topo { 
            padding: 10px 15px; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer;
        }

        .btn-voltar { background-color: #4CAF50; color: white; }
        .btn-limpar { background-color: #ff9800; color: white; }

        .grid-container {
            display: grid;
            gap: 2px;
            width: 98vw;
            max-width: 600px; 
            justify-content: center;
        }

        .quadrado {
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1; 
        }

        .quadrado.ativo {
            cursor: pointer;
            transition: transform 0.1s;
        }

        .quadrado.ativo:active img {
            transform: scale(0.9);
        }

        .quadrado.vazio {
            pointer-events: none;
        }

        .quadrado img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.6)); 
        }

        /* -------------------------------------- */
        /* MODAL (Monster Selection List)         */
        /* -------------------------------------- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 10;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }

        .modal-conteudo {
            background-color: #4a295c;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #794a8d;
            width: 90%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
        }

        .modal-conteudo h3 { margin-top: 0; text-align: center; font-size: 18px; }

        #buscaMonstro {
            padding: 10px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
            font-size: 16px;
            background-color: #e0d4e8;
        }

        .lista-monstros {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .categoria-titulo {
            background-color: #311c47;
            color: #ffd700;
            text-align: center;
            font-weight: bold;
            padding: 5px;
            margin-top: 10px;
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            border: 1px solid #221233;
        }

        .item-lista {
            display: flex;
            align-items: center;
            background-color: #3b284f;
            border: 1px solid #2b1d3d;
            border-radius: 8px;
            padding: 5px;
            cursor: pointer;
        }

        .item-lista img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-right: 15px;
            border-radius: 5px;
        }

        .item-lista span { font-weight: bold; font-size: 14px; }
        .item-lista:active { background-color: #4CAF50; }

        .btn-cancelar { 
            background-color: #f44336; color: white; width: 100%; 
            padding: 12px; border: none; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer;
        }
    </style>
</head>

            { nome: "Epic Deedge", arquivo: "monster_portrait_square_abde_epic.avif", categoria: "Epic" },
            { nome: "Epic Wubbox", arquivo: "https://raw.githubusercontent.com/Repos999/Memory/refs/heads/main/monster_portrait_square_f_epic_cold.avif", categoria: "Epic" },
            { nome: "Epic Grumpyre", arquivo: "monster_portrait_square_j_epic.avif", categoria: "Epic" },
            { nome: "Epic Yool", arquivo: "monster_portrait_square_s02_epic.avif", categoria: "Epic" },
            { nome: "Epic Strombonin", arquivo: "monster_portrait_square_p03_epic.avif", categoria: "Epic" },

            // SPECIALS
            { nome: "bbli$zard", arquivo: "monster_portrait_square_z09.avif", categoria: "Specials" },
            { nome: "Tawkerr", arquivo: "monster_portrait_square_VOC_01.avif", categoria: "Specials" },
            { nome: "Maggpi", arquivo: "monster_portrait_square_VOC_04.avif", categoria: "Specials" }
        ];

        let quadradoAtual = null;

        // --- NAVIGATION LOGIC ---
        function selecionarIlha(ilha) {
            ilhaAtual = ilha;
            
            if (ilha === 'plant') {
                itensDataRender = itensRecursos.concat(monstrosPlant, itensDipsters);
                document.getElementById('tituloPrincipal').innerText = "MSM Memory Game - Plant Island";
            } else {
                itensDataRender = itensRecursos.concat(monstrosCold, itensDipsters);
                document.getElementById('tituloPrincipal').innerText = "MSM Memory Game - Cold Island";
            }

            document.getElementById('telaMenuIlha').style.display = 'none';
            document.getElementById('telaMenuNivel').style.display = 'flex';
        }

        function voltarParaIlhas() {
            document.getElementById('telaJogo').style.display = 'none';
            document.getElementById('telaMenuNivel').style.display = 'none';
            document.getElementById('telaMenuIlha').style.display = 'flex';
            document.getElementById('tituloPrincipal').innerText = "MSM Memory Game";
        }

        function sairDoJogo() {
            if (confirm("Are you sure you want to leave? Your board will be reset.")) {
                voltarParaIlhas();
            }
        }

        function iniciarNivel(idNivel) {
            document.getElementById('telaMenuNivel').style.display = 'none';
            document.getElementById('telaJogo').style.display = 'flex';

            const layoutMatriz = layouts[idNivel];
            const colunas = layoutMatriz[0].length; 
            const tabuleiro = document.getElementById("tabuleiro");
            
            tabuleiro.style.gridTemplateColumns = `repeat(${colunas}, 1fr)`;
            tabuleiro.innerHTML = ""; 

            layoutMatriz.forEach(linha => {
                linha.forEach(celula => {
                    let div = document.createElement("div");
                    
                    if (celula === 1) {
                        div.className = "quadrado ativo";
                        div.innerHTML = `<img src="${imagemFundo}" alt="Card Back">`;
                        div.onclick = () => abrirModal(div);
                    } else {
                        div.className = "quadrado vazio"; 
                    }
                    
                    tabuleiro.appendChild(div);
                });
            });
        }

        // --- MODAL & LIST LOGIC ---
        function renderizarLista(filtro = "") {
            const listaContainer = document.getElementById("listaOpcoes");
            listaContainer.innerHTML = ""; 

            let categoriaAtualRenderizada = ""; 

            itensDataRender.forEach(item => {
                if (item.nome.toLowerCase().includes(filtro.toLowerCase())) {
                    
                    if (item.categoria !== categoriaAtualRenderizada) {
                        categoriaAtualRenderizada = item.categoria;
                        if (categoriaAtualRenderizada !== "Resources") {
                            let tituloCat = document.createElement("div");
                            tituloCat.className = "categoria-titulo";
                            tituloCat.innerText = categoriaAtualRenderizada;
                            listaContainer.appendChild(tituloCat);
                        }
                    }

                    let div = document.createElement("div");
                    div.className = "item-lista";
                    div.onclick = () => confirmarMonstro(item);
                    
                    let conteudoHTML = "";
                    if (item.arquivo === "") {
                        conteudoHTML = `<div style="width:45px; height:45px; margin-right:15px; font-size:30px; text-align:center;">🧹</div> <span>${item.nome}</span>`;
                    } else {
                        let linkImagem = item.arquivo.startsWith("http") ? item.arquivo : urlBase + item.arquivo;
                        conteudoHTML = `<img src="${linkImagem}" alt="${item.nome}"> <span>${item.nome}</span>`;
                    }

                    div.innerHTML = conteudoHTML;
                    listaContainer.appendChild(div);
                }
            });
        }

        function abrirModal(elemento) {
            quadradoAtual = elemento;
            document.getElementById("modalMonstros").style.display = "flex";
            document.getElementById("buscaMonstro").value = "";
            renderizarLista();
        }

        function fecharModal() {
            document.getElementById("modalMonstros").style.display = "none";
            quadradoAtual = null;
        }

        function filtrarLista() {
            const textoBusca = document.getElementById("buscaMonstro").value;
            renderizarLista(textoBusca);
        }

        function confirmarMonstro(item) {
            if (quadradoAtual) {
                if (item.arquivo === "") {
                    quadradoAtual.innerHTML = `<img src="${imagemFundo}" alt="Card Back">`;
                } else {
                    let linkImagem = item.arquivo.startsWith("http") ? item.arquivo : urlBase + item.arquivo;
                    quadradoAtual.innerHTML = `<img src="${linkImagem}" alt="${item.nome}">`;
                }
            }
            fecharModal();
        }

        function limparTabuleiro() {
            if(confirm("Do you want to clear all selections and flip the cards face down?")) {
                let quadrados = document.querySelectorAll(".quadrado.ativo");
                quadrados.forEach(q => {
                    q.innerHTML = `<img src="${imagemFundo}" alt="Card Back">`;
                });
            }
        }
    </script>
</body>
</html>
